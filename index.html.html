<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Report Card Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#6b7385;--line:#d9dde6;--bg:#f4f6fa;--accent:#1f4e8c;--accent2:#e8f0fb;--bad:#b3261e;--ok:#1b7a3d;--warn:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 0 8px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=number],input:not([type]),input[type=search],input[type=date],textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}
button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer}
button.ghost{background:#fff;color:var(--accent)}
button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button.small{padding:3px 8px;font-size:13px}
#saveStatus{font-size:12px;color:var(--ok);align-self:center}
nav#tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav#tabs button{background:#fff;color:var(--ink);border-color:var(--line)}
nav#tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#banner .b{margin-top:10px;padding:8px 12px;border-radius:6px;background:var(--warn);border:1px solid #e6cf85;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#banner .b.err{background:#fde7e5;border-color:#e9a8a3;color:var(--bad)}
main{padding:20px;max-width:1300px;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;font-size:14px}
th{background:var(--accent2)}
td.l,th.l{text-align:left}
input.mk{width:64px;text-align:center;padding:4px}
input.mk.bad{border-color:var(--bad);background:#fde7e5}
.tablewrap{overflow-x:auto}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.stat{background:var(--accent2);border-radius:8px;padding:8px 14px}
.stat b{display:block;font-size:20px}
.printhead{display:none;text-align:center;margin-bottom:10px}
.proc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;font-family:Arial,Helvetica,sans-serif;color:#000;overflow-x:auto}
.proc .hdr{display:flex;justify-content:space-between;gap:20px;font-size:12px;font-weight:700;margin-bottom:10px;line-height:1.4}
.proc .hdr .r{min-width:220px}
.proc table{font-size:11px;border:1.5px solid #000}
.proc th,.proc td{border:1px solid #000;padding:1px 4px;text-align:right;background:#fff;font-size:11px;white-space:nowrap}
.proc td.nm,.proc th.nm{text-align:left}
.proc th.rot{height:125px;width:30px;padding:0;vertical-align:bottom;text-align:center}
.proc th.rot span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;font-size:11px}
.proc tr.mx td{font-weight:700}
.proc tfoot td{font-family:"Times New Roman",serif}
.proc .done{margin:30px 0 0 55%;font-size:12px;line-height:1.8}
@media print{.proc{border:none;padding:0;border-radius:0;margin:0;overflow:visible}.proc thead{display:table-header-group}.proc tr{break-inside:avoid}.proc th{background:#fff!important}}
.cards{max-width:780px;margin:0 auto}
.card{background:#fff;border:1px solid #000;padding:14px 18px;margin:0 auto 18px;font-family:"Times New Roman",Times,serif;color:#000;font-size:13px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-weight:700;line-height:1.35}
.card .logo{text-align:center;margin-top:8px}
.card .logo img{height:64px;display:inline-block}
.card .logo.ph{border:1px dashed #999;color:#888;font-size:11px;padding:10px;margin:8px auto 0;max-width:260px}
.dlg-ov{position:fixed;inset:0;background:rgba(20,28,45,.5);display:flex;align-items:center;justify-content:center;z-index:4000;padding:16px}
.dlg{background:#fff;border-radius:10px;max-width:480px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg-msg{white-space:pre-line;line-height:1.45;max-height:55vh;overflow:auto;margin-bottom:12px}
.dlg-in{width:100%;margin-bottom:12px;display:block}
.dlg.wide{max-width:780px}
.dlg textarea.dlg-in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
button.dgr{background:var(--bad);border-color:var(--bad)}
.hid{display:none!important}
@media print{.proc .hid{display:table-row!important}}
.logoprompt{background:var(--warn);border:1px solid #e6cf85;border-radius:8px;padding:8px 12px;margin:0 0 10px}
.card .top img{height:58px;display:block}
.card .top .r{text-align:right;min-width:140px}
.card h3{margin:8px 0 6px;text-align:center;font-size:17px;text-decoration:underline;letter-spacing:.5px}
.card table{width:100%;border-collapse:collapse}
.card .info td{border:1px solid #000;padding:2px 6px;text-align:left;font-size:13px;background:#fff}
.card .tb{margin-top:8px}
.card .tb th,.card .tb td{border:1px solid #000;padding:2px 5px;font-size:12.5px;text-align:center;background:#fff;color:#000}
.card .tb th{font-size:10.5px}
.card .tb td.l,.card .tb th.l{text-align:left}
.card .tb .sum td{font-weight:700}
.card .inc{margin:4px 0 0;font-size:11px;font-style:italic}
.card input.cond{border:none;border-bottom:1px dotted #000;width:110px;padding:0;font:inherit;background:transparent;border-radius:0}
.card .foot{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000;margin-top:12px}
.card .foot>div{padding:3px 8px;font-weight:700;min-height:42px}
.card .foot .obs{grid-row:span 2;border-right:1px solid #000}
.card .foot .tsig{border-bottom:1px solid #000;text-align:center}
.card .foot .psig{text-align:center}
.card .foot textarea{display:block;width:100%;border:none;resize:none;font:inherit;font-weight:400;padding:2px 0;background:transparent;border-radius:0}
.two .card{font-size:11.5px;padding:8px 12px;margin-bottom:10px}
.two .card .tb th,.two .card .tb td{padding:1px 4px;font-size:11px}
.two .card .foot>div{min-height:30px}
.two-land{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1240px}
.two-land .card{width:100%;min-width:0;font-size:10.5px;padding:6px 8px;margin:0}
.two-land .card .top{font-size:10px;gap:5px}
.two-land .card .top .r{min-width:0}
.two-land .card .top img{height:38px}
.two-land .card .logo img{height:42px}
.two-land .card h3{font-size:14px;margin:5px 0 4px}
.two-land .card .info td{font-size:9.5px;padding:1px 3px}
.two-land .card .tb th,.two-land .card .tb td{font-size:9px;padding:1px 2px}
.two-land .card .foot{margin-top:6px}
.two-land .card .foot>div{min-height:25px;padding:2px 4px}
.two-land .card .inc{font-size:8px}
@media print{.cards{max-width:none}.card{page-break-after:always;break-inside:avoid;margin:0 auto}.card:last-child{page-break-after:auto}.two .card{page-break-after:auto;margin-bottom:8mm}.two-land{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6mm;width:100%;max-width:none;break-inside:auto}.two-land .card{width:100%;margin:0;page-break-after:auto;break-inside:avoid}.two-land .card:nth-child(2n){break-after:page;page-break-after:always}.two-land .card:last-child{break-after:auto;page-break-after:auto}.card th{background:#fff!important}}
@page{size:A4;margin:12mm}
/* ===== theme: bright, flag-inspired colours for the screen; printed pages stay clean ===== */
.logobox{padding:10px 14px;background:#eef6ff;border-radius:14px}
.bars h3{margin:14px 0 6px;font-size:16px;color:var(--navy)}
.bars h3 small{font-weight:600;color:var(--muted);font-size:12px;margin-left:8px}
.bars .bar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 62px;gap:10px;align-items:center;margin:7px 0}
.bars .bl{font-size:13px;font-weight:700;color:var(--ink);text-align:right}
.bars .bt{position:relative;height:14px;background:#e3ecf8;border-radius:99px}
.bars .bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a06a,#58d6a0)}
.bars .bt i.low{background:linear-gradient(90deg,#ef5350,#ff9a8f)}
.bars .bt u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#16233b;opacity:.55;text-decoration:none}
.bars .bar b{font-size:13px}
.actions{align-items:center}

@media screen{
:root{--ink:#16233b;--muted:#5f6b85;--line:#d6e0f1;--bg:#eef4fc;--accent:#1d8fe1;--accent2:#e4f1ff;--bad:#d6383a;--ok:#118a58;--warn:#fff1c2;--navy:#0f2747}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(900px 420px at 95% -5%,#cfe7ff 0,transparent 60%),radial-gradient(800px 380px at -5% 8%,#fff0bd 0,transparent 55%),#eef4fc;background-attachment:fixed;font-size:15px}
h1,h2,h3,.stat b{font-family:"Fredoka","Nunito","Segoe UI",sans-serif}

header.top{background:linear-gradient(120deg,#0f2747 0%,#16427d 62%,#1b6fc2 115%);color:#fff;border:0;padding:0;box-shadow:0 6px 24px rgba(15,39,71,.28)}
.ribbon{height:7px;background:linear-gradient(90deg,#00a1de 0 34%,#fad201 34% 67%,#1f7a4d 67% 100%)}
.hwrap{max-width:1300px;margin:0 auto;padding:14px 20px 0}
.brandrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.sunlogo{width:48px;height:48px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand h1{margin:0;font-size:23px;line-height:1.1;color:#fff;font-weight:600;letter-spacing:.2px}
.brand .sub{margin:3px 0 0;color:#b9d4f6;font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0}
.ctl label{color:#b9d4f6;font-size:12px;font-weight:700}
.ctl select{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.28);min-width:96px}
.ctl select option{color:#16233b;background:#fff}
.ctl button.ghost{background:#fad201;color:#3a2f00;box-shadow:0 3px 0 #b89a00,0 8px 14px rgba(0,0,0,.2)}
#saveStatus{color:#9be8c4;font-weight:700}
nav#tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
nav#tabs button{--c:#1d8fe1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);color:#e8f1ff;border:0;border-radius:14px 14px 0 0;padding:10px 16px 9px;font-weight:800;box-shadow:none;border-bottom:4px solid var(--c)}
nav#tabs button .ic{font-size:18px}
nav#tabs button:hover{background:rgba(255,255,255,.22)}
nav#tabs button:active{transform:none;box-shadow:none}
nav#tabs button.on{background:#fff;color:var(--ink)}
nav#tabs button[data-tab="results"]{--c:#f7b500}
nav#tabs button[data-tab="cards"]{--c:#16a06a}
nav#tabs button[data-tab="classes"]{--c:#7c5cf0}
nav#tabs button[data-tab="settings"]{--c:#ef5350}
#banner .b{border-radius:14px;border:0;background:linear-gradient(90deg,#fff3c4,#ffe38e);color:#3a2f00;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#banner .b.err{background:linear-gradient(90deg,#ffe0de,#ffc4c0);color:#8a1c18}
main{padding:22px 20px 48px}

.panel{border:0;border-radius:18px;box-shadow:0 10px 30px rgba(22,35,59,.09);padding:20px 22px}
.panel h2{font-size:20px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.panel h2::before{content:"";width:10px;height:24px;border-radius:6px;background:linear-gradient(#1d8fe1,#7c5cf0)}
#view[data-screen="results"] .panel h2::before{background:linear-gradient(#f7b500,#ff8a3d)}
#view[data-screen="cards"] .panel h2::before{background:linear-gradient(#16a06a,#6fdca8)}
#view[data-screen="classes"] .panel h2::before{background:linear-gradient(#7c5cf0,#c09cff)}
#view[data-screen="settings"] .panel h2::before{background:linear-gradient(#ef5350,#ff9a8f)}
.muted{color:var(--muted)}

select,input[type=text],input[type=number],input:not([type]),input[type=search],input[type=date],textarea{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
select:focus,input:focus,textarea:focus{border-color:#1d8fe1;outline:none;box-shadow:0 0 0 4px rgba(29,143,225,.2)}
button{border:0;background:linear-gradient(180deg,#2a9bf0,#1478cf);color:#fff;border-radius:12px;padding:9px 16px;font-weight:800;box-shadow:0 3px 0 #0f5fa6,0 8px 14px rgba(20,120,207,.22);transition:transform .08s,box-shadow .08s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0f5fa6}
button:disabled{opacity:.45;filter:grayscale(.5);box-shadow:none}
button.ghost{background:#fff;color:#1478cf;box-shadow:inset 0 0 0 2px #bcdcf8}
button.danger{background:#fff;color:#d6383a;box-shadow:inset 0 0 0 2px #f3b7b7}
button.small{padding:5px 11px;font-size:13px;border-radius:10px}
button.b-pdf{background:linear-gradient(180deg,#f2655f,#d93b3b);box-shadow:0 3px 0 #a92727,0 8px 14px rgba(217,59,59,.22)}
button.b-xls{background:linear-gradient(180deg,#27b87d,#128a5a);box-shadow:0 3px 0 #0b6a43,0 8px 14px rgba(18,138,90,.22)}
button.dgr{background:linear-gradient(180deg,#f2655f,#d93b3b);box-shadow:0 3px 0 #a92727}
button:focus-visible,a:focus-visible{outline:3px solid #ffd35c;outline-offset:2px}

th{background:linear-gradient(180deg,#eaf4ff,#d6e9fd);color:#0f2747;font-weight:800}
.tablewrap tbody tr:nth-child(even) td{background:#f6faff}
.tablewrap tbody tr:hover td{background:#e9f3ff}
input.mk{border-radius:8px}
input.mk:focus{background:#fffbe6}
.pass{color:#118a58}.fail{color:#d6383a}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:12px 0 6px}
.stat{border-radius:16px;padding:14px 16px;color:#fff;font-weight:700;font-size:13px;box-shadow:0 10px 20px rgba(22,35,59,.14)}
.stat b{font-size:31px;font-weight:600;margin-top:4px;line-height:1.1}
.t-sky{background:linear-gradient(135deg,#1d8fe1,#58b8ff)}
.t-leaf{background:linear-gradient(135deg,#12935f,#4fd3a0)}
.t-coral{background:linear-gradient(135deg,#e8474a,#ff8f80)}
.t-violet{background:linear-gradient(135deg,#6a49e6,#a58bff)}
.t-sun{background:linear-gradient(135deg,#f7b500,#ffd75a);color:#3a2800}
.logoprompt{background:linear-gradient(90deg,#fff1c2,#ffe28a);border:0;border-radius:14px;padding:12px 16px}
.proc{border:0;border-radius:14px;box-shadow:0 10px 30px rgba(22,35,59,.09)}
.card{border-radius:4px;box-shadow:0 12px 32px rgba(22,35,59,.14);border:1px solid #1d2b45}
.card .tb th{background:#e4f0ff}
.dlg{border-radius:20px;padding:22px 24px;border-top:7px solid #1d8fe1;box-shadow:0 20px 60px rgba(8,20,45,.45)}
.dlg-ov{background:rgba(10,24,52,.55);backdrop-filter:blur(2px)}
@media (max-width:700px){.brand h1{font-size:19px}.hwrap{padding:12px 12px 0}main{padding:14px 10px 40px}.panel{padding:16px 14px}nav#tabs button{padding:8px 11px}}
}

/* printing: bigger cards that fill the page; A5 and 2-up variants */
.two .card:nth-child(2n){page-break-after:always}
@media print{
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card{font-size:15.5px;padding:22px 28px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .top{font-size:15px;line-height:1.45}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .logo img{height:84px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card h3{font-size:24px;margin:12px 0 10px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .info td{padding:7px 10px;font-size:15px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .tb{margin-top:14px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .tb th{font-size:12.5px;padding:8px 5px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .tb td{padding:8px 6px;font-size:15px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .foot{margin-top:24px}
.cards:not(.two):not(.two-land):not(.a5):not(.yr) .card .foot>div{min-height:62px;padding:6px 10px}
.a5 .card{font-size:12px;padding:12px 16px}
.a5 .card .top{font-size:12px}
.a5 .card .logo img{height:50px}
.a5 .card h3{font-size:18px}
.a5 .card .info td{padding:4px 7px;font-size:12px}
.a5 .card .tb th{font-size:9.5px;padding:5px 3px}
.a5 .card .tb td{padding:5px 4px;font-size:12px}
.a5 .card .foot>div{min-height:44px}
.card{box-shadow:none}
.card .tb th{background:#fff}
}

@media print{
 .noprint{display:none!important}
 body{background:#fff}
 main{padding:0;max-width:none}
 .panel{border:none;padding:0}
 .printhead{display:block}
 th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Landscape two-up cards: keep each complete card compact and on one page. */
@media print{
  .cards.two-land{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:6mm;row-gap:0;width:100%;max-width:none;align-items:start}
  .cards.two-land .card{font-size:11.5px!important;padding:7mm 7mm!important;margin:0!important;width:100%;min-width:0;height:188mm;min-height:188mm;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid!important;page-break-inside:avoid!important}
  .cards.two-land .card .top{font-size:11px!important;line-height:1.35;gap:6px}
  .cards.two-land .card .top .r{min-width:0}
  .cards.two-land .card .top img{height:38px}
  .cards.two-land .card .logo img{height:42px}
  .cards.two-land .card h3{font-size:17px!important;margin:8px 0 7px}
  .cards.two-land .card .info td{font-size:10.5px!important;padding:3px 4px}
  .cards.two-land .card .tb{margin-top:5px}
  .cards.two-land .card .tb th,.cards.two-land .card .tb td{font-size:10px!important;padding:3px 3px}
  .cards.two-land .card .foot{margin-top:6px}
  .cards.two-land .card .foot>div{min-height:34px;padding:4px 5px}
  .cards.two-land .card .inc{font-size:9px}
  .cards.two-land .card:nth-child(2n){break-after:page;page-break-after:always}
  .cards.two-land .card:last-child{break-after:auto;page-break-after:auto}
}

/* whole-year landscape card */
.cards.yr{max-width:1240px;overflow-x:auto}
.yc{min-width:1040px;padding:14px 16px}
.yc .ytop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.yc .ybox{border:1.5px solid #000;padding:8px 14px;font-size:14px;line-height:1.55;justify-self:start;min-width:250px}
.yc .ylogo{text-align:center}.yc .ylogo img{height:56px}
.yc .ylogo.ph{border:1px dashed #999;color:#888;font-size:11px;padding:8px;max-width:200px}
.yc h3{text-decoration:none;font-size:19px;margin:10px 0 8px;letter-spacing:.8px}
.yc .yinfo{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2px 16px;font-size:12.5px;margin-bottom:6px}
.yc .ytb{table-layout:fixed;margin:0}
.yc .ytb th,.yc .ytb td{border:1px solid #000;padding:2px 1px;text-align:center;font-size:11.5px;background:#fff;overflow:hidden}

const PARTS = ['cat', 'mid', 'exam'];

function num(v) {

}

// A grading scale is valid when every band has a % from 0 to 100, no two bands start at the same %, a band starts at 0 (so every mark gets a grade) and every band has a grade letter.
function bandsError(bands) {
  if (!Array.isArray(bands) || !bands.length) return 'The grading scale needs at least one row.';
  const seen = new Set();
  for (const b of bands) {
    const m = Number(b.min);
    if (b.min === '' || b.min === null || b.min === undefined || !Number.isFinite(m) || m < 0 || m > 100) return 'Every “From %” must be a number from 0 to 100.';

    seen.add(m);
    if (!String(b.grade || '').trim()) return 'Every grade row needs a grade (for example A, B, C).';

  return '';
}
function gradeFor(pct, bands) {
  const b = [...bands].sort((a, c) => c.min - a.min);
  for (const x of b) if (pct + 1e-9 >= x.min) return x;
  return b[b.length - 1];
}
// Maximum marks of a subject in a given term (a term can have its own override).
function smax(subj, term) {
  const base = { cat: subj.cat, mid: subj.mid, exam: subj.exam };
  const o = subj.tm && subj.tm[term];
  return o ? Object.assign(base, o) : base;
}
// One subject, one term. scope: 'cat' | 'mid' | 'exam' | 'term'
function termSubject(m, subj, term, scope) {
  const t = (m && m[term]) || {};
  const sm = smax(subj, term);
  const parts = (scope === 'term' ? PARTS : [scope]).filter(p => Number(sm[p]) > 0);
  let score = 0, max = 0, n = 0;
  for (const p of parts) {
    const v = num(t[p]);

}
// One subject for any scope. Year scope: marks gained and maximum marks are ADDED over the terms that have marks,

function subjectResult(m, subj, scope, term) {
  if (scope !== 'year') return termSubject(m, subj, term, scope);
  const terms = [1, 2, 3].map(t => termSubject(m, subj, t, 'term'));
  const have = terms.filter(x => x.has);

  return { score, max, pct: score / max * 100, has: true, complete: have.length === 3 && have.every(x => x.complete), terms };
}
function studentSummary(ms, subjects, scope, term, settings) {
  const rows = subjects.map(s => Object.assign({ subj: s }, subjectResult(ms && ms[s.id], s, scope, term)));
  const have = rows.filter(r => r.has);
  const total = have.reduce((a, r) => a + r.score, 0);
  const totalMax = have.reduce((a, r) => a + r.max, 0);
  const avg = totalMax > 0 ? total / totalMax * 100 : null;

    success: have.length ? passed / have.length * 100 : null,

    .sort((a, b) => (Math.abs(b.sum.avg - a.sum.avg) > 1e-9 ? b.sum.avg - a.sum.avg : 0) || a.st.name.localeCompare(b.st.name));

function commentKey(scope) { return scope === 'year' ? 'y' : String(DB.current.term); }
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (d || ''); };
const cv = (v, mx) => (+mx > 0) ? (v === null || v === undefined ? '' : String(r1(v))) : '—';
function rankCtx(studs, cls, scope, term) {
  const cr = classResults(studs, Y().marks, cls.subjects, scope, term, DB.settings), m = {};
  cr.list.forEach(x => { if (x.pos !== null) m[x.st.id] = x.pos; });
  return { m, n: cr.stats.ranked, cr, open: cr.stats.rankingOpen };
}
const rk = (c, id) => c.m[id] === undefined ? (c.open === false ? '–' : '') : c.m[id];
const cRank = (c, id, span) => c.m[id] !== undefined ? cNum(c.m[id], span) : cT(c.open === false ? '–' : '', span);
const cStar = (c, inc) => (inc && c.pct) ? { t: c.t + ' *', span: c.span } : c;
function cardNote(m) {
  const p = [];
  if (m.incomplete) p.push('* Incomplete: some marks have not been entered yet, so this average only counts the marks that exist.');
  if (m.rankClosed) p.push('Positions are shown once every learner’s marks are complete.');
  return p.join(' ');
}

function cardModel(x, cls, scope, term, ctx) {
  const s = x.sum, sch = DB.school, st = x.st, marks = Y().marks[st.id] || {};
  const cm = ((Y().comments[st.id] || {})[commentKey(scope)]) || {};
  const nm = r => r.subj.name.toUpperCase();
  let cols, rows, sums, bold, ysums = null;
  if (scope === 'term') {
    let mid = 0, cat = 0, ex = 0, midE = 0, catE = 0, exE = false, mxMid = 0, mxCat = 0, mxEx = 0;
    rows = s.rows.map(r => {
      const m = (marks[r.subj.id] || {})[term] || {}, mx = smax(r.subj, term);
      const vm = num(m.mid), vc = num(m.cat), ve = num(m.exam);
      if (vm !== null && +mx.mid > 0) { mid += vm; midE += +mx.mid; }
      if (vc !== null && +mx.cat > 0) { cat += vc; catE += +mx.cat; }
      if (ve !== null && +mx.exam > 0) { ex += ve; exE = true; }
      mxMid += +mx.mid || 0; mxCat += +mx.cat || 0; mxEx += +mx.exam || 0;
      return [cT(nm(r)), +mx.mid === +mx.cat ? cNum(mx.mid) : cT(r1(mx.mid) + ' / ' + r1(mx.cat)), cMark(vm, mx.mid), cMark(vc, mx.cat), cNum(mx.exam), cMark(ve, mx.exam), r.has ? cNum(r.max) : cT(''), r.has ? cNum(r.score) : cT('')];
    });
    cols = [['SUBJECTS', 30, 'l'], ['MAX', 10], ['MID', 10], ['CAT', 10], ['MAX EXAM', 13], ['EXAM', 10], ['FULL MARKS', 15], ['MARKS GAINED', 17]];
    bold = 7;
    sums = [
      [cT('Total'), mxMid === mxCat ? cNum(mxMid) : cT(r1(mxMid) + ' / ' + r1(mxCat)), midE ? cNum(mid) : cT(''), catE ? cNum(cat) : cT(''), cNum(mxEx), exE ? cNum(ex) : cT(''), s.counted ? cNum(s.totalMax) : cT(''), s.counted ? cNum(s.total) : cT('')],
      [cT('Average', 2), midE ? cStar(cPct(mid / midE * 100), midE < mxMid - 1e-9) : cT(''), catE ? cStar(cPct(cat / catE * 100), catE < mxCat - 1e-9) : cT(''), s.avg === null ? cT('', 4) : cStar(cPct(s.avg, 4), !s.complete)],
      [cT('Rank of: ' + ctx.main.n, 2), cRank(ctx.mid, st.id), cRank(ctx.cat, st.id), cRank(ctx.main, st.id, 4)]
    ];
  } else if (scope === 'year') {
    const ts = [1, 2, 3].map(t => studentSummary(marks, cls.subjects, 'term', t, DB.settings));
    const P = [0, 1, 2].map(() => ({ mid: 0, cat: 0, ex: 0, midE: false, catE: false, exE: false, mxEx: 0 }));
    let mx1m = 0, mx1c = 0, aM = 0, aG = 0;
    rows = s.rows.map(r => {
      const sm = smax(r.subj, 1); mx1m += +sm.mid || 0; mx1c += +sm.cat || 0;
      const cells = [cT(nm(r)), +sm.mid === +sm.cat ? cNum(sm.mid) : cT(r1(sm.mid) + ' / ' + r1(sm.cat))];
      let am = 0, ag = 0;
      [1, 2, 3].forEach((t, i) => {
        const m = (marks[r.subj.id] || {})[t] || {}, mx = smax(r.subj, t), T = r.terms[i], p = P[i];
        const vm = num(m.mid), vc = num(m.cat), ve = num(m.exam);
        if (vm !== null && +mx.mid > 0) { p.mid += vm; p.midE = true; }
        if (vc !== null && +mx.cat > 0) { p.cat += vc; p.catE = true; }
        if (ve !== null && +mx.exam > 0) { p.ex += ve; p.exE = true; }
        p.mxEx += +mx.exam || 0;
        if (T.has) { am += T.max; ag += T.score; }
        cells.push(cMark(vm, mx.mid), cMark(vc, mx.cat), cNum(mx.exam), cMark(ve, mx.exam), T.has ? cNum(T.max) : cT(''), T.has ? cNum(T.score) : cT(''));
      });
      aM += am; aG += ag;
      cells.push(r.has ? cNum(am) : cT(''), r.has ? cNum(ag) : cT(''), r.has ? cStar(cPct(r.pct), !r.complete) : cT(''));
      return cells;
    });
    const tot = [cT('TOTAL'), mx1m === mx1c ? cNum(mx1m) : cT(r1(mx1m) + ' / ' + r1(mx1c))];
    P.forEach((p, i) => tot.push(p.midE ? cNum(p.mid) : cT(''), p.catE ? cNum(p.cat) : cT(''), cNum(p.mxEx), p.exE ? cNum(p.ex) : cT(''), ts[i].counted ? cNum(ts[i].totalMax) : cT(''), ts[i].counted ? cNum(ts[i].total) : cT('')));
    // Annual maximum must match the maximum marks represented by the annual marks gained, not Term 1's CAT + midterm maximum.
    tot.push(s.counted ? cNum(aM) : cT(''), s.counted ? cNum(aG) : cT(''), cStar(cPct(s.avg), !s.complete));
    const pos = (c, span) => cT(String(rk(c, st.id)) + ' / ' + (c.n || ctx.N), span);
    ysums = [
      { k: 'tot', cells: tot },
      { k: 'pct', cells: [cT('%'), cStar(cPct(ts[0].avg, 7), !ts[0].complete), cStar(cPct(ts[1].avg, 6), !ts[1].complete), cStar(cPct(ts[2].avg, 6), !ts[2].complete), cStar(cPct(s.avg, 3), !s.complete)] },
      { k: 'pos', cells: [cT('Position'), pos(ctx.t[0], 7), pos(ctx.t[1], 6), pos(ctx.t[2], 6), pos(ctx.main, 3)] },
      { k: 'obs', cells: [] },
      { k: 'sigT', cells: [cT("Teacher's signature"), cT('', 7), cT('', 6), cT('', 6), cT('', 3)] },
      { k: 'sigP', cells: [cT("Parent's signature"), cT('', 7), cT('', 6), cT('', 6), cT('', 3)] }
    ];
    cols = null; sums = []; bold = -1;
  } else {
    const mxAll = cls.subjects.reduce((a, sj) => a + (+smax(sj, term)[scope] || 0), 0);
    cols = [['SUBJECTS', 46, 'l'], ['MAX', 16], ['MARKS GAINED', 20], ['PERCENT', 18]]; bold = 2;
    rows = s.rows.map(r => [cT(nm(r)), cNum(+smax(r.subj, term)[scope] || 0), r.has ? cNum(r.score) : cT(''), r.has ? cPct(r.pct) : cT('')]);
    sums = [
      [cT('Total'), cNum(mxAll), s.counted ? cNum(s.total) : cT(''), cT('')],
      [cT('Average', 2), cStar(cPct(s.avg, 2), !s.complete)],
      [cT('Rank of: ' + ctx.main.n, 2), cRank(ctx.main, st.id, 2)]
    ];
  }
  return {
    st, school: { country: sch.country || '', name: (sch.name || '').toUpperCase(), address: (sch.address || '').toUpperCase(), phone: sch.phone || '', ministry: sch.ministry || '', place: sch.place || '' },
    kind: scope === 'year' ? 'year' : 'std', ysums,
    year: DB.current.year, period: scope === 'year' ? 'Whole year' : ordinal(term) + ' Term', logo: sch.logo || '',
    title: scope === 'year' ? 'PROGRESSIVE SCHOOL REPORT' : 'REPORT CARD' + ({ mid: ' – MIDTERM', cat: ' – CAT', exam: ' – END-OF-TERM EXAM', term: '' }[scope]),
    clsName: cls.name, N: ctx.N, born: fmtDate(st.dob), pob: st.pob || '', idno: st.idno || '', conduct: cm.conduct || '', obs: cm.teacher || '',
    cols, rows, sums, bold, incomplete: !s.complete, rankClosed: ctx.main.open === false
  };
}

/* ---------- whole-year report card: landscape "Progressive school report" (three terms + annual points) ---------- */
const Y_W = [20, 4.6, 4.2, 4.2, 5, 4.2, 5, 5.6, 4.2, 4.2, 5, 4.2, 5, 5.6, 4.2, 4.2, 5, 4.2, 5, 5.6, 5.2, 5.6, 6.4];
const Y_SUM = Y_W.reduce((a, b) => a + b, 0);
const Y_HEAD = ['', 'MAX', 'MID', 'CAT', 'MAX EX', 'EX', 'FULL MARKS', 'MARKS GAINED', 'MID', 'CAT', 'MAX EX', 'EX', 'FULL MARKS', 'MARKS GAINED', 'MID', 'CAT', 'MAX EX', 'EX', 'FULL MARKS', 'MARKS GAINED', 'MAX', 'GAINED', '%'];
const Y_GROUPS = [['1st TERM', 1, 7], ['2nd TERM', 8, 6], ['3rd TERM', 14, 6], ['ANNUAL POINTS', 20, 3]];
const Y_START = new Set([1, 8, 14, 20]), Y_GAIN = new Set([7, 13, 19, 21]);
const yDone = m => 'Done at ' + (m.school.place || '') + ' the ' + '.'.repeat(m.school.place ? 30 : 34);
function yearHTML(m) {
  const sch = m.school, cc = (c0, extra) => ((c0 === 0 ? 'l ' : '') + (Y_START.has(c0) ? 'gs ' : '') + (Y_GAIN.has(c0) ? 'gn ' : '') + (extra || '')).trim();
  const colgroup = '<colgroup>' + Y_W.map(w => `<col style="width:${(w / Y_SUM * 100).toFixed(3)}%">`).join('') + '</colgroup>';
  const head = `<tr><th class="l" rowspan="2">Subjects</th>${Y_GROUPS.map(g => `<th colspan="${g[2]}" class="gs">${g[0]}</th>`).join('')}</tr><tr>${Y_HEAD.slice(1).map((h, i) => `<th class="${Y_START.has(i + 1) ? 'gs' : ''}">${h}</th>`).join('')}</tr>`;
  const body = m.rows.map(r => `<tr>${r.map((c, i) => `<td class="${cc(i, i >= 20 ? 'b' : '')}">${esc(c.t)}</td>`).join('')}</tr>`).join('');
  const sumRows = m.ysums.map(r => {
    if (r.k === 'obs') return `<tr class="obs"><td class="l"><b>Observations</b></td><td colspan="14" class="l"><textarea rows="2" data-f="cmt" data-st="${m.st.id}" data-who="teacher">${esc(m.obs)}</textarea></td><td colspan="3" class="l"><b>Conduct</b></td><td colspan="5" class="l"><input class="cond" data-f="cmt" data-st="${m.st.id}" data-who="conduct" value="${esc(m.conduct)}"></td></tr>`;
    let c0 = 0;
    return `<tr class="${r.k}">${r.cells.map((c, j) => { const h = `<td colspan="${c.span}" class="${(j === 0 ? 'l ' : '') + (Y_START.has(c0) && j ? 'gs ' : '') + (r.k === 'tot' && Y_GAIN.has(c0) ? 'gn ' : '') + (r.k === 'tot' && c0 >= 20 ? 'b' : '')}">${esc(c.t)}</td>`; c0 += c.span; return h; }).join('')}</tr>`;
  }).join('');
  return `<div class="card yc" data-name="${esc((m.st.name + ' ' + m.idno).toLowerCase())}">
  <div class="ytop"><div class="ybox">${esc(sch.country)}<br>${esc(sch.name)}<br>${esc(sch.phone)}</div>${m.logo ? `<div class="ylogo"><img alt="" src="${m.logo}"></div>` : '<div class="ylogo ph noprint">School logo appears here (add it above)</div>'}<div></div></div>
  <h3>${esc(m.title)}</h3>
  <div class="yinfo"><div><b>NAMES:</b> ${esc(m.st.name.toUpperCase())}</div><div><b>Number of Students:</b> ${m.N}</div><div><b>Class:</b> ${esc(m.clsName)}</div>
   <div><b>Student's No.:</b> ${esc(m.idno)}</div><div><b>Option:</b></div><div><b>School Year:</b> ${esc(m.year)}</div></div>
  <table class="ytb">${colgroup}<thead>${head}</thead><tbody>${body}${sumRows}</tbody></table>
  ${cardNote(m) ? `<p class="inc">${esc(cardNote(m))}${m.incomplete ? ' Annual points count only assessment components with marks entered.' : ''}</p>` : ''}
  <div class="verdict"><div><b>VERDICT OF THE JURY</b><div class="vopts"><div><i class="bx"></i>Promoted</div><div><i class="bx"></i>Advised to repeat</div><div><i class="bx"></i>Proposed to resit</div></div></div>
   <div class="vr"><div>${esc(yDone(m))}</div><div class="hs">Head of the School</div></div></div></div>`;
}
function cardFromModel(m) {
  if (m.kind === 'year') return yearHTML(m);
  const td = (c, extra) => `<td${c.span > 1 ? ` colspan="${c.span}"` : ''}${extra || ''}>${esc(c.t)}</td>`;
  const dots = n => '.'.repeat(n), sch = m.school;
  const head = `<tr>${m.cols.map(c => `<th${c[2] === 'l' ? ' class="l"' : ''}>${esc(c[0])}</th>`).join('')}</tr>`;
  const body = m.rows.map(r => `<tr>${r.map((c, i) => i === 0 ? td(c, ' class="l"') : i === m.bold ? `<td><b>${esc(c.t)}</b></td>` : td(c)).join('')}</tr>`).join('');
  const sums = m.sums.map(r => `<tr class="sum">${r.map((c, i) => i === 0 ? td(c, ' class="l"') : td(c)).join('')}</tr>`).join('');
  return `<div class="card" data-name="${esc((m.st.name + ' ' + m.idno).toLowerCase())}"><div class="top"><div>${esc(sch.country)}<br>${esc(sch.name)}<br>${esc(sch.address)}<br>${esc(sch.phone)}</div><div class="r">${esc(sch.ministry)}<br>${esc(m.year)}<br>${esc(m.period)}</div></div>
  ${m.logo ? `<div class="logo"><img alt="" src="${m.logo}"></div>` : '<div class="logo ph noprint">School logo appears here (add it above)</div>'}
  <h3>${esc(m.title)}</h3>
  <table class="info"><tr><td colspan="3"><b>Student Name:</b> ${esc(m.st.name.toUpperCase())}</td></tr>
   <tr><td colspan="2"><b>Born:</b> ${esc(m.born) || dots(14)} &nbsp;at&nbsp; ${esc(m.pob) || dots(14)}</td><td><b>Class:</b> ${esc(m.clsName)}</td></tr>
   <tr><td><b>ID No.:</b> ${esc(m.idno)}</td><td><b>N. Students:</b> ${m.N}</td><td><b>Conduct:</b> <input class="cond" data-f="cmt" data-st="${m.st.id}" data-who="conduct" value="${esc(m.conduct)}"></td></tr></table>
  <table class="tb"><thead>${head}</thead><tbody>${body}${sums}</tbody></table>
  ${cardNote(m) ? `<p class="inc">${esc(cardNote(m))}</p>` : ''}
  <div class="foot"><div class="obs">Observations<textarea rows="3" data-f="cmt" data-st="${m.st.id}" data-who="teacher">${esc(m.obs)}</textarea></div><div class="tsig">Teacher Signature</div><div class="psig">Parent Signature</div></div></div>`;
}
// Sort learners (items have .st and .pos): by name, or by position (learners without marks always last)
function sortLearners(list, mode) {
  const nm = (a, b) => a.st.name.localeCompare(b.st.name);
  const l = list.slice();
  if (mode === 'name') return l.sort(nm);
  if (mode === 'namez') return l.sort((a, b) => nm(b, a));
  const has = l.filter(x => x.pos !== null).sort((a, b) => (a.pos - b.pos) || nm(a, b));
  const no = l.filter(x => x.pos === null).sort(nm);
  if (mode === 'rankrev') has.reverse();
  return has.concat(no);
}
const optList = (cur, arr) => arr.map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('');
const findBox = () => `<label>Find a learner<input type="search" data-f="q" placeholder="Type a name or ID no." value="${esc(ui.q[ui.tab] || '')}"><span id="qCount" class="muted"></span></label>`;

function cardsSelection() {
  const cls = curClass(); if (!cls) return null;
  const scope = ui.rcScope, term = DB.current.term, studs = studentsOf(cls.id), pass = DB.settings.passPct;
  if (!studs.length) return { cls, studs, chosen: [], selected: [], scope, term };
  if (ui.rcStudent !== 'all' && !studs.find(s => s.id === ui.rcStudent)) ui.rcStudent = 'all';
  const ctx = { N: studs.length, main: rankCtx(studs, cls, scope, term) };
  if (scope === 'term') { ctx.mid = rankCtx(studs, cls, 'mid', term); ctx.cat = rankCtx(studs, cls, 'cat', term); }
  if (scope === 'year') ctx.t = [1, 2, 3].map(t => rankCtx(studs, cls, 'term', t));
  const fl = ui.rcFilter;
  const keep = x => fl === 'pass' ? (x.sum.avg !== null && x.sum.avg + 1e-9 >= pass)
    : fl === 'fail' ? (x.sum.avg !== null && x.sum.avg + 1e-9 < pass)
    : fl === 'incomplete' ? !x.sum.complete
    : fl === 'nomarks' ? x.sum.avg === null : true;
  const all = ctx.main.cr.list;
  const chosen = ui.rcStudent === 'all' ? sortLearners(all.filter(keep), ui.rcSort) : all.filter(x => x.st.id === ui.rcStudent);
  const q = (ui.q.cards || '').trim().toLowerCase();
  const selected = ui.rcStudent === 'all' && q ? chosen.filter(x => (x.st.name + ' ' + (x.st.idno || '')).toLowerCase().includes(q)) : chosen;
  return { cls, scope, term, studs, ctx, all, chosen, selected };
}

/* ---------- actions ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

/* ---------- on-page dialogs (many browsers and viewers silently block alert/confirm/prompt) ---------- */
function dialog(o) {
  return new Promise(resolve => {
    const prev = document.activeElement, input = !!o.input;
    const ov = document.createElement('div'); ov.className = 'dlg-ov noprint';
    ov.innerHTML = '<div class="dlg' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true"><div class="dlg-msg"></div>' + (input ? (o.area ? '<textarea class="dlg-in" rows="10" spellcheck="false"></textarea>' : '<input class="dlg-in" type="text">') : '') + '<div class="dlg-btns">' + (o.cancel ? '<button type="button" class="ghost" data-r="cancel"></button>' : '') + '<button type="button" data-r="ok"></button></div></div>';
    ov.querySelector('.dlg-msg').textContent = o.message;
    const okb = ov.querySelector('[data-r="ok"]'), cb = ov.querySelector('[data-r="cancel"]'), inp = ov.querySelector('.dlg-in');
    okb.textContent = o.ok || 'OK'; if (cb) cb.textContent = o.cancel; if (o.danger) okb.classList.add('dgr'); if (inp) inp.value = o.def || '';
    const done = v => { ov.remove(); try { if (prev && prev.focus) prev.focus(); } catch (_) {} resolve(v); };
    const no = () => done(input ? null : false), yes = () => done(input ? inp.value : true);
    ov.addEventListener('click', e => { e.stopPropagation(); const r = e.target.closest('[data-r]'); if (r) (r.dataset.r === 'ok' ? yes : no)(); });
    ov.addEventListener('keydown', e => {

   ${tch.length ? `<div class="row"><button class="ghost" data-act="uCopyAsg">Copy the previous year’s class access into ${esc(yr)}</button><span class="muted">Matches classes and subjects by name.</span></div>` : ''}
   <h3>Administrators</h3>
   ${table(adm.map(p => row(p, p.id === me ? '<span class="muted">you</span>' : `<button class="small ghost" data-act="uMakeTeacher" data-id="${p.id}">Make teacher</button> <button class="small danger" data-act="uDeactivate" data-id="${p.id}">Deactivate</button>`)), '')}
  </div>`;
}
async function uSetProfile(id, patch) {
  const r = await CLOUD.sb.from('profiles').update(patch).eq('id', id);
  if (r.error) { await say('Could not save: ' + friendly(r.error)); return false; }
  const p = CLOUD.profiles.find(x => x.id === id); if (p) Object.assign(p, patch); render(); return true;
}
async function uSetAssign(tid, cid, desired) {
  const cur = CLOUD.allAssign.filter(a => a.teacher_id === tid && a.class_id === cid), sb = CLOUD.sb;
  const del = cur.filter(a => !desired.includes(a.subject_id)), add = desired.filter(s => !cur.some(a => a.subject_id === s));
  try {
    if (del.length) { const r = await sb.from('assignments').delete().in('id', del.map(a => a.id)); if (r.error) throw r.error; CLOUD.allAssign = CLOUD.allAssign.filter(a => !del.includes(a)); }
    if (add.length) { const r = await sb.from('assignments').insert(add.map(s => ({ teacher_id: tid, class_id: cid, subject_id: s }))).select(); if (r.error) throw r.error; CLOUD.allAssign = CLOUD.allAssign.concat(r.data || []); }
  } catch (e) { await say('Could not save: ' + friendly(e)); const r = await sb.from('assignments').select('*'); if (!r.error) CLOUD.allAssign = r.data; }
  render();
}
async function cloudChange(el) {
  const f = el.dataset.f; if (!CLOUD.on || !['asgClass', 'asgAll', 'asgSubj'].includes(f)) return false;
  const t = el.dataset.t, c = el.dataset.c, cls = Y().classes.find(x => x.id === c); if (!cls) return true;
  const cur = CLOUD.allAssign.filter(a => a.teacher_id === t && a.class_id === c).map(a => a.subject_id), subj = cls.subjects.map(s => s.id);
  if (f === 'asgClass') await uSetAssign(t, c, el.checked ? ['*'] : []);
  else if (f === 'asgAll') await uSetAssign(t, c, el.checked ? ['*'] : subj);
  else { const want = new Set(cur.filter(s => s !== '*')); if (el.checked) want.add(el.dataset.s); else want.delete(el.dataset.s); await uSetAssign(t, c, want.size === subj.length ? ['*'] : [...want]); }
  return true;
}
async function cloudAct(act, b) {
  switch (act) {
    case 'signOut': await cloudSignOut(); return true;
    case 'changePw': authShow('change'); return true;
    case 'uApprove': await uSetProfile(b.dataset.id, { active: true, role: 'teacher' }); return true;
    case 'uApproveAdmin': if (await ask('An administrator can change everything, including other people’s access. Approve this person as administrator?', { ok: 'Approve as administrator', danger: false })) await uSetProfile(b.dataset.id, { active: true, role: 'admin' }); return true;
    case 'uMakeAdmin': if (await ask('Make this teacher an administrator? They will be able to change everything.', { ok: 'Make administrator', danger: false })) await uSetProfile(b.dataset.id, { role: 'admin' }); return true;
    case 'uMakeTeacher': await uSetProfile(b.dataset.id, { role: 'teacher' }); return true;
    case 'uDeactivate': if (await ask('Deactivate this account? The person can no longer open any data until you approve them again.', { ok: 'Deactivate', danger: true })) await uSetProfile(b.dataset.id, { active: false }); return true;
    case 'uCopyAsg': {
      const yrs = Object.keys(DB.years).sort(), i = yrs.indexOf(DB.current.year), prev = i > 0 ? DB.years[yrs[i - 1]] : null;
      if (!prev) { await say('There is no previous academic year to copy from.'); return true; }
      const norm = s => String(s).trim().toLowerCase(); let n = 0;
      for (const a of CLOUD.allAssign.slice()) {
        const pc = prev.classes.find(c => c.id === a.class_id); if (!pc) continue;
        const nc = Y().classes.find(c => norm(c.name) === norm(pc.name)); if (!nc) continue;
        let sid = '*'; if (a.subject_id !== '*') { const ps = pc.subjects.find(s => s.id === a.subject_id), ns = ps && nc.subjects.find(s => norm(s.name) === norm(ps.name)); if (!ns) continue; sid = ns.id; }
        if (CLOUD.allAssign.some(x => x.teacher_id === a.teacher_id && x.class_id === nc.id && x.subject_id === sid)) continue;
        const r = await CLOUD.sb.from('assignments').insert({ teacher_id: a.teacher_id, class_id: nc.id, subject_id: sid }).select();
        if (!r.error) { CLOUD.allAssign = CLOUD.allAssign.concat(r.data || []); n++; }
      }
      render(); await say(n ? n + ' class access entr' + (n === 1 ? 'y was' : 'ies were') + ' copied.' : 'Nothing new to copy.'); return true;
    }
    case 'cloudConnect': {
      const url = ($('cfgUrl') || {}).value || '', key = ($('cfgKey') || {}).value || '';
      if (!/^https:\/\/[^\s]+\.supabase\.co\/?$/i.test(url.trim()) && !/^https?:\/\/[^\s]+$/i.test(url.trim())) { await say('Please paste the Project URL exactly as Supabase shows it (it starts with https://).'); return true; }
      if (key.trim().length < 20) { await say('Please paste the “anon public” key from Supabase.'); return true; }
      if (!await ask('Connect this copy of the app to the online database? After this, people must sign in. Data saved only on this computer can be uploaded once, after the administrator signs in.', { ok: 'Connect', danger: false })) return true;
      try { localStorage.setItem('rcm_cloud_cfg', JSON.stringify({ url: url.trim(), key: key.trim() })); } catch (e) { await say('This browser does not allow saving the connection.'); return true; }
      location.reload(); return true;
    }
    case 'refreshCloud': await cloudReload(true); return true;
  }
  return false;
}
function cloudPanel() {
  if (!CLOUD.on) return `<div class="panel"><h2>Online database and logins</h2>
   <p>Right now all data is saved only in this browser. To let the administrator and the teachers sign in with their own email and password and always find the same data on any computer, connect the app to your online database (see the setup guide).</p>
   <div class="row"><label>Project URL<input id="cfgUrl" placeholder="https://xxxx.supabase.co" style="width:340px"></label><label>Anon public key<input id="cfgKey" placeholder="eyJ…" style="width:340px"></label><button data-act="cloudConnect">Connect</button></div></div>`;
  return `<div class="panel"><h2>Online database</h2>
   <p>Connected to <b>${esc(CLOUD.cfg.url)}</b>. Every change is saved online automatically; nobody needs to download backups to keep their work.</p>
   <div class="row"><button class="ghost" data-act="refreshCloud">Refresh from the database now</button>${CLOUD.legacy ? '<span class="muted">Data saved on this computer from before is still in this browser; it was offered for upload the first time the administrator signed in.</span>' : ''}</div></div>`;
}

if (CLOUD.on) {
  // the online library loads asynchronously; wait for it (or its failure) before connecting
  const waitLib = () => { if (window.supabase || window.__sbFail || Date.now() - CLOUD.t0 > 15000) cloudBoot(); else setTimeout(waitLib, 80); };
  CLOUD.t0 = Date.now(); authShow('loading', 'Connecting…'); waitLib();
} else {
  ui.tab = Y().classes.length ? 'marks' : 'classes';
  render();
  save();
}
</script>
